spring:
  application:
    name: parking-lot-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parking_lot}
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
    hikari:
      pool-name: parking-lot-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    # Flyway manages the schema; Hibernate only validates on startup.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  mail:
    from: ${MAIL_FROM:noreply@parkinglot.lokum.tech}
    enabled: ${MAIL_ENABLED:true}
  payment:
    stripe:
      enabled: ${STRIPE_ENABLED:false}
      api-key: ${STRIPE_API_KEY:sk_test_mock}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_mock}

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Shows "db": {"status": "UP"} without leaking connection details.
      show-components: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    tech.lokum.parkinglot: DEBUG
