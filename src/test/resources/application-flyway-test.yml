spring:
  datasource:
    url: jdbc:h2:mem:flyway_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      # Flyway creates the schema; Hibernate validates it matches entities.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'

app:
  payment:
    stripe:
      enabled: false
      api-key: sk_test_mock
      webhook-secret: whsec_test_mock
