spring:
  datasource:
    url: jdbc:h2:mem:parking_lot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      # Tests use H2 with Hibernate-managed schema.
      # Flyway migrations target PostgreSQL and are tested separately.
      ddl-auto: create-drop
  flyway:
    # Disabled for H2 tests — migrations use PostgreSQL-specific syntax.
    enabled: false

app:
  payment:
    stripe:
      enabled: false
      api-key: sk_test_mock
      webhook-secret: whsec_test_mock
