services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parking_lot
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking_lot"]
      interval: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/parking_lot
      DB_USERNAME: parking
      DB_PASSWORD: parking
    ports:
      - "8080:8080"

volumes:
  pgdata:
